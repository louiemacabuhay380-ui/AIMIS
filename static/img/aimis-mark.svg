<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6cc0f2"/><stop offset="1" stop-color="#2f8ad4"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eaf5fd"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <!-- antenna -->
  <path d="M256 150 V104" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
  <circle cx="256" cy="92" r="24" fill="#ffd166"/>
  <circle cx="249" cy="85" r="7" fill="#fff3cf"/>
  <!-- side ears -->
  <rect x="70" y="232" width="44" height="84" rx="22" fill="#d6ecfb"/>
  <rect x="398" y="232" width="44" height="84" rx="22" fill="#d6ecfb"/>
  <!-- speech-bubble head with a little tail -->
  <path d="M196 144 H316 C383 144 420 181 420 248 V300 C420 367 383 404 316 404 H214 L160 446 C150 454 138 446 142 434 L152 398 C116 384 92 350 92 300 V248 C92 181 129 144 196 144 Z" fill="url(#face)"/>
  <!-- happy eyes -->
  <path d="M168 268 Q196 234 224 268" fill="none" stroke="#1f6fb2" stroke-width="20" stroke-linecap="round"/>
  <path d="M288 268 Q316 234 344 268" fill="none" stroke="#1f6fb2" stroke-width="20" stroke-linecap="round"/>
  <!-- blush -->
  <ellipse cx="164" cy="314" rx="26" ry="15" fill="#ffb4c2" opacity="0.85"/>
  <ellipse cx="348" cy="314" rx="26" ry="15" fill="#ffb4c2" opacity="0.85"/>
  <!-- smile -->
  <path d="M226 318 Q256 348 286 318" fill="none" stroke="#1f6fb2" stroke-width="16" stroke-linecap="round"/>
</svg>
