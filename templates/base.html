<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AIMIS{% endblock %}</title>

  <!-- Apply the saved theme before the page draws, so it never flashes the wrong colors -->
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("aimis-theme"); } catch (e) {}
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", saved || (prefersDark ? "dark" : "light"));
    })();
  </script>

  <link rel="icon" id="favicon" href="{{ url_for('static', filename='img/aimis-mark.png') }}">
  <script>
    // Browser tab icon: when the computer uses dark mode, show the logo in white so it's visible on dark tab bars
    (function () {
      if (!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)) return;
      var img = new Image();
      img.onload = function () {
        try {
          var c = document.createElement("canvas");
          c.width = img.width; c.height = img.height;
          var g = c.getContext("2d");
          g.drawImage(img, 0, 0);
          g.globalCompositeOperation = "source-in";   // keep the logo's shape, paint it white
          g.fillStyle = "#ffffff";
          g.fillRect(0, 0, c.width, c.height);
          document.getElementById("favicon").href = c.toDataURL("image/png");
        } catch (e) {}
      };
      img.src = "{{ url_for('static', filename='img/aimis-mark.png') }}";
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a href="{{ url_for('dashboard') if session.get('user_id') else url_for('login') }}" class="brand">
        <span class="brand-logo">
          <img src="{{ url_for('static', filename='img/aimis-mark.png') }}" alt=""
               onerror="this.style.display='none'">
        </span>
        <span class="brand-name">AIMIS</span>
      </a>

      <nav class="site-nav">
        {% if session.get('user_id') %}
          <a href="{{ url_for('dashboard') }}"
             class="nav-link {{ 'active' if request.endpoint == 'dashboard' }}">Dashboard</a>
        {% endif %}

        <button type="button" id="themeToggle" class="theme-toggle" aria-label="Switch to dark mode" title="Switch theme">
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
          <span class="theme-label">Dark</span>
        </button>

        {% if session.get('user_id') %}
          <span class="user-avatar" title="{{ session.full_name }}">{{ (session.full_name or 'U')[0] | upper }}</span>
          <a href="{{ url_for('logout') }}" class="nav-link">Log out</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}
        <div class="flash" role="status">
          <span>{{ m }}</span>
          <button type="button" class="flash-close" aria-label="Dismiss" onclick="this.parentElement.remove()">×</button>
        </div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <script>
    (function () {
      var btn = document.getElementById("themeToggle");
      var label = btn.querySelector(".theme-label");
      function sync() {
        var dark = document.documentElement.getAttribute("data-theme") === "dark";
        label.textContent = dark ? "Light" : "Dark";
        btn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
      }
      btn.addEventListener("click", function () {
        var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        try { localStorage.setItem("aimis-theme", next); } catch (e) {}
        sync();
        window.dispatchEvent(new CustomEvent("themechange", { detail: next }));   // lets charts recolor
      });
      sync();
    })();
  </script>
</body>
</html>
