{% extends "base.html" %}
{% block title %}Forgot password · AIMIS{% endblock %}

{% block content %}
<div class="auth-card card">
  <h1>Forgot your password?</h1>
  <p class="muted">Enter the email you registered with. We'll send you a link to choose a new password.</p>

  <form method="POST" class="form">
    <label>Email
      <input name="email" type="email" placeholder="you@example.com" required autofocus>
    </label>
    <button type="submit" class="btn btn-block">Send reset link</button>
  </form>

  <p class="muted auth-switch">Remembered it? <a href="{{ url_for('login') }}">Back to log in</a></p>
</div>
{% endblock %}
