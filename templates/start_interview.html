{% extends "base.html" %}
{% block content %}
<h2>Start a mock interview</h2>
<form method="POST">
  <label>Category:
    <select name="category">
      {% for c in categories %}<option>{{ c }}</option>{% endfor %}
    </select>
  </label><br>
  <label>Difficulty:
    <select name="difficulty">
      <option>Beginner</option><option>Intermediate</option><option>Advanced</option>
    </select>
  </label><br>
  <label>Number of questions:
    <input name="number_of_questions" type="number" min="1" max="10" value="3">
  </label><br>

  <p><label>
    <input type="checkbox" name="consent" value="yes" required>
    I agree to have my voice recorded during this interview. My recordings and answers
    will only be used to analyze my performance and give me feedback.
  </label></p>

  <button type="submit">Begin</button>
</form>
<p><a href="{{ url_for('dashboard') }}">Back to dashboard</a></p>
{% endblock %}
