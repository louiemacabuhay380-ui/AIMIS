{% extends "base.html" %}
{% block title %}Log in · AIMIS{% endblock %}

{% block content %}
<div class="auth-card card">
  <img class="auth-logo" src="{{ url_for('static', filename='img/aimis-logo.png') }}" alt=""
       onerror="this.style.display='none'">
  <h1>Welcome back</h1>
  <p class="muted">Log in to continue practicing your interview skills.</p>

  <form method="POST" class="form">
    <label>Email
      <input name="email" type="email" placeholder="you@example.com" required>
    </label>
    <label>Password
      <input name="password" type="password" placeholder="Your password" required>
    </label>
    <button type="submit" class="btn btn-block">Log in</button>
  </form>

  <p class="muted auth-switch">No account yet? <a href="{{ url_for('register') }}">Register</a></p>
</div>
{% endblock %}
