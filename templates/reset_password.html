{% extends "base.html" %}
{% block title %}Choose a new password · AIMIS{% endblock %}

{% block content %}
<div class="auth-card card">
  <h1>Choose a new password</h1>
  <p class="muted">For <b>{{ email }}</b></p>

  <form method="POST" class="form">
    <label>New password
      <input name="password" type="password" placeholder="At least 8 characters" minlength="8" required autofocus>
    </label>
    <label>Confirm new password
      <input name="confirm" type="password" placeholder="Type it again" minlength="8" required>
    </label>
    <button type="submit" class="btn btn-block">Save new password</button>
  </form>

  <p class="muted auth-switch"><a href="{{ url_for('login') }}">Back to log in</a></p>
</div>
{% endblock %}
