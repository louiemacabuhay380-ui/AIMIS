{% extends "base.html" %}
{% block title %}Register · AIMIS{% endblock %}

{% block content %}
<div class="auth-card card">
  <img class="auth-logo" src="{{ url_for('static', filename='img/aimis-logo.png') }}" alt=""
       onerror="this.style.display='none'">
  <h1>Create an account</h1>
  <p class="muted">Practice soft-skills interviews with AI feedback.</p>

  <form method="POST" class="form">
    <label>Full name
      <input name="full_name" placeholder="Juan Dela Cruz" required>
    </label>
    <label>Email
      <input name="email" type="email" placeholder="you@example.com" required>
    </label>
    <label>Password
      <input name="password" type="password" placeholder="At least 8 characters" minlength="8" required>
    </label>
    <button type="submit" class="btn btn-block">Register</button>
  </form>

  <p class="muted auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
