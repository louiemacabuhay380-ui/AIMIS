{% extends "base.html" %}
{% block title %}Analyzing · AIMIS{% endblock %}

{% from "_robot.html" import robot %}
{% block layout %}focus{% endblock %}
{% block content %}
<div class="processing-wrap">
<div class="card processing">
  <div class="processing-bot">{{ robot("thinking") }}</div>
  <div class="spinner" id="spinner"></div>
  <h1>Getting your results ready</h1>
  <p id="status" class="muted">This takes about a minute.<br>Please keep this page open.</p>
  <button id="retryBtn" type="button" class="btn" hidden>Try again</button>
</div>
</div>

<script>
const statusEl = document.getElementById("status");
const retryBtn = document.getElementById("retryBtn");
const spinner = document.getElementById("spinner");
const processUrl = "{{ url_for('run_processing', interview_id=iv.interview_id) }}";
const summaryUrl = "{{ url_for('interview_summary', interview_id=iv.interview_id) }}";
let seconds = 0, timerId;

async function run() {
  retryBtn.hidden = true;
  spinner.hidden = false;
  statusEl.textContent = "This takes about a minute. Please keep this page open.";
  seconds = 0;
  clearInterval(timerId);
  timerId = setInterval(() => {
    seconds++;
    if (seconds === 60) statusEl.textContent = "Almost there. This can take a few more minutes. Please keep this page open.";
  }, 1000);
  try {
    const res = await fetch(processUrl, { method: "POST" });
    const data = await res.json();
    if (data.ok) {
      window.location.href = summaryUrl;
      return;
    }
    statusEl.textContent = "We couldn't finish your results. Your answers are saved. Please try again.";
    console.warn("AIMIS processing:", data.error);
  } catch (e) {
    statusEl.textContent = "Connection problem. Your answers are saved. Please try again.";
  }
  clearInterval(timerId);
  spinner.hidden = true;
  retryBtn.hidden = false;
}

retryBtn.onclick = run;
run();
</script>
{% endblock %}
